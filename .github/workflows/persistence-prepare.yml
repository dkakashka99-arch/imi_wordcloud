name: Prepare persistence verification
on:
  push:
    branches: [ops/initial-vps-access]
    paths: [.github/workflows/persistence-prepare.yml]
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use verified permanent deploy secret
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/ssh"
          python3 ops/normalize-ssh-key.py "$RUNNER_TEMP/ssh/key"
          printf '%s\n' '212.109.196.228 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIP2pCyNRY+vzT6biE/COZgoFYewXJz4acfqM4NNRsJEA' > "$RUNNER_TEMP/ssh/known_hosts"
          ssh -i "$RUNNER_TEMP/ssh/key" -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes -o "UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts" deploy@212.109.196.228 'test -s /opt/imi-wordcloud/shared/app.env; test -s /opt/imi-wordcloud/shared/certs/russian-trusted-ca.pem; echo HOST_READY'
      - name: Save one isolated synthetic answer before automated release
        run: |
          SSH_OPTS=(-i "$RUNNER_TEMP/ssh/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts")
          scp "${SSH_OPTS[@]}" ops/persistence-smoke.mjs deploy@212.109.196.228:/opt/imi-wordcloud/shared/persistence-smoke.mjs
          ssh "${SSH_OPTS[@]}" deploy@212.109.196.228 'set -eu; mkdir -p /opt/imi-wordcloud/shared/persistence; chmod 700 /opt/imi-wordcloud/shared/persistence; test ! -e /opt/imi-wordcloud/shared/persistence/fixture.json; cd /opt/imi-wordcloud/current; export RELEASE=$(cat /opt/imi-wordcloud/shared/current-release); docker compose --env-file /opt/imi-wordcloud/shared/compose.env -f compose.production.yaml run --rm -T -v /opt/imi-wordcloud/shared/persistence-smoke.mjs:/app/persistence-smoke.mjs:ro -v /opt/imi-wordcloud/shared/persistence:/run/persistence tools node --import tsx /app/persistence-smoke.mjs prepare'
      - if: always()
        run: rm -f "$RUNNER_TEMP/ssh/key" "$RUNNER_TEMP/ssh/known_hosts"
