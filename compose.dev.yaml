# Local development only. Production deployment and HTTPS are a separate gate.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mir_wordcloud
      POSTGRES_USER: mir
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD locally}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mir -d mir_wordcloud']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_dev:
