# Installed after certbot has obtained the certificate. http context include.
# A college may share one NAT: keep the per-IP public budget generous.
limit_req_zone $binary_remote_addr zone=public_api:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=login:1m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=connections:10m;
server {
    listen 80;
    server_name imi-cloudpoll.ru;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://imi-cloudpoll.ru$request_uri; }
}
server {
    listen 443 ssl;
    server_name imi-cloudpoll.ru;
    ssl_certificate /etc/letsencrypt/live/imi-cloudpoll.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/imi-cloudpoll.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security 'max-age=31536000' always;
    server_tokens off;
    client_max_body_size 16k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    limit_conn connections 500;
    limit_req_status 429;
    # Do not log answers, query strings, cookies or credentials.
    access_log off;
    location = /api/admin/login {
        limit_req zone=login burst=10 nodelay;
        include /etc/nginx/imi-wordcloud-proxy.conf;
    }
    location /api/ {
        limit_req zone=public_api burst=600 nodelay;
        include /etc/nginx/imi-wordcloud-proxy.conf;
    }
    location / { include /etc/nginx/imi-wordcloud-proxy.conf; }
}
