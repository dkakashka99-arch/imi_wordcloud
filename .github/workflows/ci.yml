name: CI
on:
  push:
    branches: [develop, main, 'feature/**', 'fix/**']
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mir
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: mir_wordcloud
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mir -d mir_wordcloud"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://mir:ci-test-only@localhost:5432/mir_wordcloud
      APP_ORIGIN: http://localhost:3000
      GIGACHAT_ENABLED: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:migrate
      - run: npm run test:integration
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
