name: Semantic root cause synthetic diagnosis
on:
  push:
    branches: [ops/initial-vps-access]
    paths: [.github/workflows/semantic-runtime-diagnostic.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Diagnose runtime without secrets or participant originals
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/ssh"
          python3 ops/normalize-ssh-key.py "$RUNNER_TEMP/ssh/key"
          printf '%s\n' '212.109.196.228 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIP2pCyNRY+vzT6biE/COZgoFYewXJz4acfqM4NNRsJEA' > "$RUNNER_TEMP/ssh/known_hosts"
          ssh -T -i "$RUNNER_TEMP/ssh/key" -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes -o "UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts" deploy@212.109.196.228 'bash -s' <<'REMOTE'
          set -eu
          root=/opt/imi-wordcloud
          export RELEASE=$(cat "$root/shared/current-release")
          echo "release=$RELEASE"
          cd "$root/releases/$RELEASE"
          compose=(docker compose --env-file "$root/shared/compose.env" -f compose.production.yaml)
          app=$("${compose[@]}" ps -q app)
          docker exec "$app" node -e 'console.log(JSON.stringify({enabled:process.env.GIGACHAT_ENABLED,keyPresent:Boolean(process.env.GIGACHAT_AUTH_KEY||process.env.GIGACHAT_AUTH_KEY_FILE)}))'
          docker logs --since 6h "$app" 2>&1 | rg 'semantic_|Semantic worker' | tail -30 || true
          "${compose[@]}" run --rm -T tools node --import tsx --input-type=module <<'JS'
          import {Pool} from 'pg';
          const db=new Pool({connectionString:process.env.DATABASE_URL});
          for(const sql of ["SELECT e.rehearsal,e.archived,sq.status,sq.error,count(*)::int n,min(sq.attempts) min_attempts,max(sq.attempts) max_attempts FROM semantic_queue sq JOIN questions q ON q.id=sq.question_id JOIN events e ON e.id=q.event_id GROUP BY 1,2,3,4", "SELECT method,version,count(*)::int n FROM semantic_history GROUP BY method,version"]){console.log(JSON.stringify((await db.query(sql)).rows));}
          const {gigaClient}=await import('./src/lib/ai/client.ts');
          const {validateMatches}=await import('./src/lib/semantic/worker.ts');
          const {z}=await import('zod');
          const client=gigaClient(),model=await client.model();
          const sources=['проверка сафари','навигацич','стабильность','низкая зарплата'];
          const candidates=['проверка safari','навигация','стабильность','высокая зарплата',...sources];
          const schema=z.toJSONSchema(z.object({matches:z.array(z.object({source:z.string(),target:z.string(),relation:z.enum(['synonym','abbreviation','spelling'])})).max(12)}).strict());
          for(let i=0;i<3;i++){
            let phase='generation';
            try{
              const r=await client.generate(model,'Объединяй эквивалентные короткие ответы на вопрос: синонимы, сокращения и очевидные опечатки. Не объединяй разные смыслы и общие темы. Возвращай source только из sources, target только из candidates; неоднозначные пропускай.',{question:'Что важно при выборе работы?',sources,candidates},schema);
              phase='server_validation';
              const parsed=z.object({matches:z.array(z.object({source:z.string(),target:z.string(),relation:z.enum(['synonym','abbreviation','spelling'])}))}).safeParse(r.result);
              const matches=parsed.success?parsed.data.matches:[];
              console.log(JSON.stringify({event:'synthetic_shape',model:r.model,round:i,schemaValid:parsed.success,matchCount:matches.length,unknownSource:matches.filter(m=>!sources.includes(m.source)).length,unknownTarget:matches.filter(m=>!candidates.includes(m.target)).length,selfMatches:matches.filter(m=>m.source===m.target).length,duplicateSources:matches.length-new Set(matches.map(m=>m.source)).size,targetIsSource:matches.filter(m=>matches.some(n=>n.source===m.target)).length}));
              validateMatches(r.result,sources,candidates);
              console.log(JSON.stringify({event:'legacy_synthetic',round:i,status:'PASS'}));
            }catch(e){console.log(JSON.stringify({event:'legacy_synthetic',round:i,phase,status:'FAIL',code:e.code||e.name,detail:e.detail}));}
          }
          await db.end();
          JS
          REMOTE
      - if: always()
        run: rm -f "$RUNNER_TEMP/ssh/key" "$RUNNER_TEMP/ssh/known_hosts"
