name: Final post-load preservation and queue audit
on:
  push:
    branches: [ops/initial-vps-access]
    paths: [.github/workflows/semantic-runtime-diagnostic.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: dfb18f664f89c743238a8f3aa1696227c4fca877
      - name: Diagnose runtime without secrets or participant originals
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/ssh"
          python3 ops/normalize-ssh-key.py "$RUNNER_TEMP/ssh/key"
          printf '%s\n' '212.109.196.228 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIP2pCyNRY+vzT6biE/COZgoFYewXJz4acfqM4NNRsJEA' > "$RUNNER_TEMP/ssh/known_hosts"
          ssh -T -i "$RUNNER_TEMP/ssh/key" -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes -o "UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts" deploy@212.109.196.228 'bash -s' <<'REMOTE'
          set -eu
          root=/opt/imi-wordcloud
          export RELEASE=$(cat "$root/shared/current-release")
          test "$RELEASE" = dfb18f664f89c743238a8f3aa1696227c4fca877
          cd "$root/releases/$RELEASE"
          docker compose --env-file "$root/shared/compose.env" -f compose.production.yaml run --rm -T -v /opt/imi-wordcloud/shared/semantic-recovery-pr19-cohort.json:/run/cohort.json:ro tools node --input-type=module <<'JS'
          import {Pool} from 'pg';import {readFileSync} from 'node:fs';import assert from 'node:assert/strict';
          const before=JSON.parse(readFileSync('/run/cohort.json','utf8'));const db=new Pool({connectionString:process.env.DATABASE_URL,max:2});
          const originals=(await db.query("SELECT count(*)::int n,md5(coalesce(string_agg(id::text||original_text||canonical_key,'|' ORDER BY id),'')) checksum FROM submissions WHERE created_at<=$1",[before.cutoff])).rows[0];const aliases=(await db.query("SELECT md5(coalesce(string_agg(wa.question_id::text||wa.source||wa.target,'|' ORDER BY wa.question_id,wa.source),'')) checksum FROM word_aliases wa JOIN questions q ON q.id=wa.question_id JOIN events e ON e.id=q.event_id WHERE e.slug='mir-27-oct'")).rows[0].checksum;
          const errors=(await db.query("SELECT error,count(*)::int n FROM semantic_queue WHERE error IN('invalid_mapping','invalid_response','empty_generation','safety_or_incomplete') OR status='pending' GROUP BY 1")).rows;
          const cohort=(await db.query("SELECT status,error,error_detail,count(*)::int n FROM semantic_queue WHERE md5(question_id::text||':'||source)=ANY($1::text[]) GROUP BY 1,2,3",[before.cohort.map(c=>c.key)])).rows;const queue=(await db.query('SELECT status,error,count(*)::int n FROM semantic_queue GROUP BY 1,2')).rows;
          console.log(JSON.stringify({event:'final_post_load_audit',originalVotes:originals.n,originalsUnchanged:JSON.stringify(originals)===JSON.stringify(before.originals),protectedAliasesUnchanged:aliases===before.protectedAliases,cohort,queue,errors}));assert.deepEqual(originals,before.originals);assert.equal(aliases,before.protectedAliases);assert.equal(errors.length,0);assert.equal(cohort.reduce((n,r)=>n+r.n,0),21);await db.end();
          JS
          app=$(docker compose --env-file "$root/shared/compose.env" -f compose.production.yaml ps -q app)
          test "$(docker inspect --format '{{.Config.Image}}' "$app")" = "imi-wordcloud:$RELEASE"
          test "$(docker inspect --format '{{.RestartCount}}' "$app")" = 0
          test "$(docker inspect --format '{{.State.OOMKilled}}' "$app")" = false
          docker inspect --format 'image={{.Config.Image}} restarts={{.RestartCount}} oom={{.State.OOMKilled}} running={{.State.Running}}' "$app"
          curl --fail --show-error --silent --max-time 15 https://imi-cloudpoll.ru/api/ready
          REMOTE
      - if: always()
        run: rm -f "$RUNNER_TEMP/ssh/key" "$RUNNER_TEMP/ssh/known_hosts"
