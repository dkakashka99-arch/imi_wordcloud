name: Public mobile QR regression
on:
  push:
    branches: [ops/initial-vps-access]
    paths: [.github/workflows/public-mobile-regression.yml]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Use official HTTPS Ubuntu mirror
        run: |
          for f in /etc/apt/apt-mirrors.txt /etc/apt/apt-security-mirrors.txt; do
            if test -f "$f"; then sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$f"; fi
          done
          printf 'Acquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::Retries "2";\n' | sudo tee /etc/apt/apt.conf.d/80-ci-network
      - run: npx playwright install --with-deps chromium webkit
        timeout-minutes: 8
      - name: Wait for reliability release to be deployed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 120); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=6245b7abf9fa91e369f088fafe2f42c5bc2b393e&event=workflow_run&per_page=20")
            if printf '%s' "$runs" | jq -e '[.workflow_runs[] | select(.name=="Production")] | any(.[]; .conclusion=="success") and all(.[]; .status=="completed")' >/dev/null; then exit 0; fi
            sleep 10
          done
          exit 1
      - name: Real public iPhone WebKit and Android Chromium QR navigation
        run: node ops/public-mobile-regression.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-mobile-qr-evidence
          path: public-mobile-evidence/
          retention-days: 7

# Recheck native browser navigation after the HTTP2 transport mitigation.
