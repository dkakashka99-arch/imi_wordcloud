name: Semantic recovery audit snapshot
on:
  push:
    branches: [ops/initial-vps-access]
    paths: [.github/workflows/semantic-runtime-diagnostic.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: a1b898b6983fa1011842f0d158231e2830979e4d
      - name: Diagnose runtime without secrets or participant originals
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/ssh"
          python3 ops/normalize-ssh-key.py "$RUNNER_TEMP/ssh/key"
          printf '%s\n' '212.109.196.228 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIP2pCyNRY+vzT6biE/COZgoFYewXJz4acfqM4NNRsJEA' > "$RUNNER_TEMP/ssh/known_hosts"
          ssh -T -i "$RUNNER_TEMP/ssh/key" -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes -o "UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts" deploy@212.109.196.228 'bash -s' <<'REMOTE'
          set -eu
          root=/opt/imi-wordcloud
          export RELEASE=$(cat "$root/shared/current-release")
          echo "release=$RELEASE"
          cd "$root/releases/$RELEASE"
          compose=(docker compose --env-file "$root/shared/compose.env" -f compose.production.yaml)
          app=$("${compose[@]}" ps -q app)
          docker exec "$app" node -e 'console.log(JSON.stringify({enabled:process.env.GIGACHAT_ENABLED,keyPresent:Boolean(process.env.GIGACHAT_AUTH_KEY||process.env.GIGACHAT_AUTH_KEY_FILE)}))'
          if test ! -f "$root/shared/semantic-recovery-pr19-cohort.json"; then
            umask 077
            "${compose[@]}" run --rm -T tools node --input-type=module <<'JS' > "$root/shared/semantic-recovery-pr19-cohort.tmp"
          import {Pool} from 'pg';
          const db=new Pool({connectionString:process.env.DATABASE_URL});
          await db.query('BEGIN ISOLATION LEVEL REPEATABLE READ READ ONLY');
          const cutoff=(await db.query('SELECT now() cutoff')).rows[0].cutoff;
          const cohort=(await db.query("SELECT md5(sq.question_id::text||':'||sq.source) key,sq.status,sq.error,sq.attempts,e.slug='mir-27-oct' protected FROM semantic_queue sq JOIN questions q ON q.id=sq.question_id JOIN events e ON e.id=q.event_id WHERE sq.status='pending' AND sq.error='invalid_response'")).rows;
          const originals=(await db.query("SELECT count(*)::int n,md5(coalesce(string_agg(id::text||original_text||canonical_key,'|' ORDER BY id),'')) checksum FROM submissions WHERE created_at<=$1",[cutoff])).rows[0];
          const protectedAliases=(await db.query("SELECT md5(coalesce(string_agg(wa.question_id::text||wa.source||wa.target,'|' ORDER BY wa.question_id,wa.source),'')) checksum FROM word_aliases wa JOIN questions q ON q.id=wa.question_id JOIN events e ON e.id=q.event_id WHERE e.slug='mir-27-oct'")).rows[0].checksum;
          await db.query('COMMIT');await db.end();
          console.log(JSON.stringify({cutoff,cohort,originals,protectedAliases}));
          JS
            mv "$root/shared/semantic-recovery-pr19-cohort.tmp" "$root/shared/semantic-recovery-pr19-cohort.json"
          fi
          python3 - <<'PYCODE'
          import json
          p=json.load(open('/opt/imi-wordcloud/shared/semantic-recovery-pr19-cohort.json'))
          print(json.dumps({'event':'recovery_before','count':len(p['cohort']),'protected':sum(r['protected'] for r in p['cohort']),'originalVotes':p['originals']['n']}))
          PYCODE
          REMOTE
      - if: always()
        run: rm -f "$RUNNER_TEMP/ssh/key" "$RUNNER_TEMP/ssh/known_hosts"
