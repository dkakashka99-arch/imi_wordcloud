name: Synthetic contextual verdict diagnosis
on:
  push:
    branches: [ops/initial-vps-access]
    paths: [.github/workflows/semantic-runtime-diagnostic.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 481d02a414c3f20b46939afa01eb58882a48f2ff
      - name: Diagnose runtime without secrets or participant originals
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/ssh"
          python3 ops/normalize-ssh-key.py "$RUNNER_TEMP/ssh/key"
          printf '%s\n' '212.109.196.228 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIP2pCyNRY+vzT6biE/COZgoFYewXJz4acfqM4NNRsJEA' > "$RUNNER_TEMP/ssh/known_hosts"
          ssh -T -i "$RUNNER_TEMP/ssh/key" -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes -o "UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts" deploy@212.109.196.228 'bash -s' <<'REMOTE'
          set -eu
          root=/opt/imi-wordcloud
          export RELEASE=$(cat "$root/shared/current-release")
          echo "release=$RELEASE"
          cd "$root/releases/$RELEASE"
          compose=(docker compose --env-file "$root/shared/compose.env" -f compose.production.yaml)
          app=$("${compose[@]}" ps -q app)
          docker exec "$app" node -e 'console.log(JSON.stringify({enabled:process.env.GIGACHAT_ENABLED,keyPresent:Boolean(process.env.GIGACHAT_AUTH_KEY||process.env.GIGACHAT_AUTH_KEY_FILE)}))'
          docker logs --since 6h "$app" 2>&1 | rg 'semantic_|Semantic worker' | tail -30 || true
          "${compose[@]}" run --rm -T tools node --input-type=module <<'JS'
          import {Pool} from 'pg';
          const db=new Pool({connectionString:process.env.DATABASE_URL});
          console.log(JSON.stringify((await db.query("SELECT e.slug='mir-27-oct' protected_event,e.rehearsal,sq.status,sq.error,count(*)::int n FROM semantic_queue sq JOIN questions q ON q.id=sq.question_id JOIN events e ON e.id=q.event_id GROUP BY 1,2,3,4")).rows));
          await db.end();
          JS
          REMOTE
          scp -i "$RUNNER_TEMP/ssh/key" -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes -o "UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts" src/lib/semantic/classifier.ts src/lib/ai/client.ts scripts/check-semantic-live.ts deploy@212.109.196.228:/tmp/
          ssh -T -i "$RUNNER_TEMP/ssh/key" -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes -o "UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts" deploy@212.109.196.228 'bash -s' <<'REMOTE'
          set -eu
          root=/opt/imi-wordcloud
          export RELEASE=$(cat "$root/shared/current-release")
          cd "$root/releases/$RELEASE"
          docker compose --env-file "$root/shared/compose.env" -f compose.production.yaml run --rm -T -v /tmp/classifier.ts:/app/src/lib/semantic/classifier.ts:ro -v /tmp/client.ts:/app/src/lib/ai/client.ts:ro tools node --import tsx --input-type=module <<'JS'
          import {GigaClient,aiConfig,transport} from './src/lib/ai/client.ts';import {classify} from './src/lib/semantic/classifier.ts';
          const client=new GigaClient(aiConfig(),async(...args)=>{const r=await transport(...args);if(args[0].endsWith('chat/completions')&&r.status===200){try{const result=JSON.parse(r.body.choices[0].message.content);if(result.decisions)console.log(JSON.stringify({event:'synthetic_verdict_reason',decisions:result.decisions}));}catch{}}return r;});
          const fixtures=[{question:'Что нужно проверить на сайте?',words:['проверка Safari','проверка сафари']},{question:'Что нужно проверить на сайте?',words:['проверка Chrome','проверка хром']},{question:'Какие языки программирования поддерживать?',words:['Python','питон']}];
          for(const f of fixtures)for(let round=0;round<2;round++){const result=await classify(client,await client.model(),f.question,f.words,f.words);console.log(JSON.stringify({event:'synthetic_context_result',fixture:f.words[0],round,matches:result.matches}));}
          JS
          REMOTE
      - if: always()
        run: rm -f "$RUNNER_TEMP/ssh/key" "$RUNNER_TEMP/ssh/known_hosts"
