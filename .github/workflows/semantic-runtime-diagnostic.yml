name: Diagnose remaining isolated mapping rejections
on:
  push:
    branches: [ops/initial-vps-access]
    paths: [.github/workflows/semantic-runtime-diagnostic.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 0bedcb04527d2a1eba7f8aaa99d8e2b8990c59ce
      - name: Diagnose runtime without secrets or participant originals
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/ssh"
          python3 ops/normalize-ssh-key.py "$RUNNER_TEMP/ssh/key"
          printf '%s\n' '212.109.196.228 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIP2pCyNRY+vzT6biE/COZgoFYewXJz4acfqM4NNRsJEA' > "$RUNNER_TEMP/ssh/known_hosts"
          ssh -T -i "$RUNNER_TEMP/ssh/key" -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes -o "UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts" deploy@212.109.196.228 'bash -s' <<'REMOTE'
          set -eu
          root=/opt/imi-wordcloud
          export RELEASE=$(cat "$root/shared/current-release")
          test "$RELEASE" = 0bedcb04527d2a1eba7f8aaa99d8e2b8990c59ce
          cd "$root/releases/$RELEASE"
          docker compose --env-file "$root/shared/compose.env" -f compose.production.yaml run --rm -T -v /opt/imi-wordcloud/shared/semantic-recovery-pr19-cohort.json:/run/cohort.json:ro tools node --input-type=module <<'JS'
          import {Pool} from 'pg';import {readFileSync} from 'node:fs';import assert from 'node:assert/strict';
          const before=JSON.parse(readFileSync('/run/cohort.json','utf8'));const keys=before.cohort.filter(c=>!c.protected).map(c=>c.key);const db=new Pool({connectionString:process.env.DATABASE_URL,max:2});
          const rows=(await db.query("SELECT status,error,error_detail,attempts,count(*)::int n FROM semantic_queue WHERE md5(question_id::text||':'||source)=ANY($1::text[]) GROUP BY 1,2,3,4",[keys])).rows;
          const originals=(await db.query("SELECT count(*)::int n,md5(coalesce(string_agg(id::text||original_text||canonical_key,'|' ORDER BY id),'')) checksum FROM submissions WHERE created_at<=$1",[before.cutoff])).rows[0];
          const aliases=(await db.query("SELECT md5(coalesce(string_agg(wa.question_id::text||wa.source||wa.target,'|' ORDER BY wa.question_id,wa.source),'')) checksum FROM word_aliases wa JOIN questions q ON q.id=wa.question_id JOIN events e ON e.id=q.event_id WHERE e.slug='mir-27-oct'")).rows[0].checksum;
          console.log(JSON.stringify({event:'isolated_recovery_complete',rows,originalsUnchanged:JSON.stringify(originals)===JSON.stringify(before.originals),protectedAliasesUnchanged:aliases===before.protectedAliases}));assert.deepEqual(originals,before.originals);assert.equal(aliases,before.protectedAliases);assert(!rows.some(r=>r.status==='pending'));await db.end();
          JS
          app=$(docker compose --env-file "$root/shared/compose.env" -f compose.production.yaml ps -q app)
          docker logs --since 15m "$app" 2>&1 | grep -E '"event":"semantic_(retry|batch|validation)"' | tail -120 || true
          REMOTE
      - if: always()
        run: rm -f "$RUNNER_TEMP/ssh/key" "$RUNNER_TEMP/ssh/known_hosts"
